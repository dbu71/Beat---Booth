<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Beat Booth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Lexend:wght@400;600;800&display=swap">
<style>
/* Layout: one-screen DJ booth. Pick a DJ, pick a vibe, 4x4 pad grid in the middle, transport under the thumbs.
   Look: two worlds. DJ Ary is a 70s record sleeve (oxblood, orange, mustard, teal). DJ Cali is a late-night club (indigo, pink, cyan, violet). */
:root{
  color-scheme: dark;
  --bg:#1f1013;
  --surface:#2f1a1e;
  --line:#4d2c32;
  --ink:#fff1e0;
  --dim:#cfae9f;
  --c1:#ff6b2c;
  --c2:#f5b82e;
  --c3:#2dbfa6;
  --c4:#ff8aa0;
  --accent:#f5b82e;
  --on:#1f1013;
  --rec:#ff3b4a;
  --font-display:'Bowlby One','Arial Black',Impact,sans-serif;
  --font-ui:'Lexend',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-dj="cali"]{
  --bg:#0f1035;
  --surface:#1a1b52;
  --line:#2f3185;
  --ink:#f1efff;
  --dim:#aeabe6;
  --c1:#ff4fa3;
  --c2:#36e1e8;
  --c3:#9b7dff;
  --c4:#c7f26b;
  --accent:#36e1e8;
  --on:#0f1035;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-ui);
  padding-block:12px 20px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  transition:background .3s;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{max-width:480px;margin:0 auto;display:grid;gap:10px}

.head{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 12px}
.brand{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
.tag{margin:0;font-size:12px;color:var(--dim)}

.djs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dj{
  --djc:#ff6b2c;--djc2:#f5b82e;
  display:flex;align-items:center;gap:10px;min-width:0;
  padding:8px 10px;
  border:2px solid var(--line);border-radius:16px;
  background:transparent;color:var(--dim);text-align:left;
}
.dj[data-dj="cali"]{--djc:#ff4fa3;--djc2:#36e1e8}
.dj[aria-pressed="true"]{background:var(--surface);border-color:var(--djc2);color:var(--ink)}
.dj .txt{min-width:0;display:grid;gap:1px}
.dj b{font-family:var(--font-display);font-weight:400;font-size:17px;letter-spacing:.03em}
.dj small{font-size:10.5px;line-height:1.25;color:var(--dim)}
.vinyl{
  position:relative;flex:none;width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at center,var(--djc2) 0 23%,#0c0c0c 24% 100%);
  box-shadow:inset 0 0 0 2px #222;
}
.vinyl::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:
    repeating-radial-gradient(circle at center,transparent 0 3px,rgba(255,255,255,.07) 3px 4px),
    conic-gradient(from 0deg,transparent 0 18%,rgba(255,255,255,.22) 24%,transparent 30% 68%,rgba(255,255,255,.22) 74%,transparent 80%);
}
.vinyl::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--bg)}
.dj.spin .vinyl{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.vibes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vibe{
  min-height:42px;padding:6px 8px;border-radius:999px;
  border:2px solid var(--line);background:transparent;color:var(--dim);
  font-weight:600;font-size:14px;
}
.vibe[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}

.info{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:34px}
.hint{margin:0;flex:1 1 auto;min-width:0;font-size:13px;line-height:1.3;color:var(--ink)}
.dots{flex:none;display:flex;gap:5px;align-items:center}
.dots i{display:block;width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i:nth-child(4n+1){width:12px;height:12px}
.dots i.on{background:var(--accent)}
.dots.rec i.on{background:var(--rec)}

.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;touch-action:none}
.pad{
  --pc:var(--c1);
  aspect-ratio:1/1;min-width:0;padding:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:0;border-radius:14px;
  background:var(--pc);color:var(--on);
  box-shadow:0 5px 0 rgba(0,0,0,.38);
  touch-action:none;
  transition:transform .06s,filter .06s,box-shadow .06s;
}
.pad.k2{--pc:var(--c2)}
.pad.k3{--pc:var(--c3)}
.pad.k4{--pc:var(--c4)}
.pad .n{font-family:var(--font-display);font-size:clamp(11px,3.5vw,15px);line-height:1;text-transform:uppercase;letter-spacing:.01em;max-width:100%;overflow-wrap:anywhere;text-align:center}
.pad .s{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.72}
.pad.hit{filter:brightness(1.3) saturate(1.1);transform:translateY(3px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.38),0 0 24px var(--pc)}

.transport{display:grid;grid-template-columns:2.2fr 1fr 1fr 1fr;gap:8px}
.tbtn{
  min-height:54px;min-width:0;padding:4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.tbtn svg{width:20px;height:20px;fill:currentColor;flex:none}
.tbtn.stroke svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.tbtn.play{background:var(--accent);border-color:var(--accent);color:var(--on);flex-direction:row;gap:8px;font-size:15px}
.tbtn.play svg{width:22px;height:22px}
.tbtn.recb svg{fill:var(--rec)}
.tbtn.recb[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#fff}
.tbtn.recb[aria-pressed="true"] svg{fill:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.tbtn:active{transform:translateY(2px)}

.opts{display:flex;flex-wrap:wrap;gap:8px}
.tempo{flex:1.4 1 140px;display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:44px;padding:4px 6px;border:2px solid var(--line);border-radius:999px}
.tempo button{width:36px;height:34px;border:0;border-radius:999px;background:var(--surface);font-size:20px;font-weight:800;line-height:1}
.tempo output{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.tempo output b{font-size:16px}
.chip{
  flex:1 1 90px;min-height:44px;padding:4px 8px;border-radius:999px;
  border:2px solid var(--line);background:transparent;color:var(--dim);font-size:13px;font-weight:600;
}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);background:var(--surface)}
.foot{margin:2px 0 0;font-size:11.5px;line-height:1.45;color:var(--dim)}

@media (prefers-reduced-motion: reduce){
  .dj.spin .vinyl,.tbtn.recb[aria-pressed="true"] svg{animation:none}
  .pad{transition:none}
}
</style>

<div class="app">
  <header class="head">
    <h1 class="brand">Beat Booth</h1>
    <p class="tag">Pick a DJ. Pick a vibe. Tap the pads.</p>
  </header>

  <div class="djs" role="group" aria-label="Choose a DJ">
    <button type="button" class="dj" data-dj="ary" aria-pressed="true">
      <span class="vinyl" aria-hidden="true"></span>
      <span class="txt"><b>DJ Ary</b><small>Hip hop, soul, funk</small></span>
    </button>
    <button type="button" class="dj" data-dj="cali" aria-pressed="false">
      <span class="vinyl" aria-hidden="true"></span>
      <span class="txt"><b>DJ Cali</b><small>R&amp;B, house, jazz</small></span>
    </button>
  </div>

  <div class="vibes" id="vibes" role="group" aria-label="Choose a vibe"></div>

  <div class="info">
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>

  <div class="pads" id="pads" role="group" aria-label="Sound pads"></div>

  <div class="transport">
    <button type="button" class="tbtn play" id="btnPlay" aria-label="Play the beat">
      <svg id="icPlay" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg id="icStop" viewBox="0 0 24 24" aria-hidden="true" hidden><rect x="5.5" y="5.5" width="13" height="13" rx="2"/></svg>
      <span id="playTxt">Play</span>
    </button>
    <button type="button" class="tbtn recb" id="btnRec" aria-pressed="false" aria-label="Record a loop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>
      <span>Rec</span>
    </button>
    <button type="button" class="tbtn stroke" id="btnUndo" aria-label="Undo the last layer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6L4 11l5 5"/><path d="M4 11h9a6 6 0 010 9h-2"/></svg>
      <span>Undo</span>
    </button>
    <button type="button" class="tbtn stroke" id="btnClear" aria-label="Clear the loop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span>Clear</span>
    </button>
  </div>

  <div class="opts">
    <div class="tempo" role="group" aria-label="Tempo">
      <button type="button" id="bpmDown" aria-label="Slower">&minus;</button>
      <output id="bpmOut" aria-live="polite"><b>90</b> BPM</output>
      <button type="button" id="bpmUp" aria-label="Faster">+</button>
    </div>
    <button type="button" class="chip" id="btnTidy" aria-pressed="true">Tidy timing</button>
    <button type="button" class="chip" id="btnBack" aria-pressed="true">Backing beat</button>
  </div>

  <p class="foot">No sound? Turn off your phone&rsquo;s silent switch and turn the volume up. On a keyboard, 1-4, Q-R, A-F and Z-V play the pads and Space starts the beat.</p>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mtof=m=>440*Math.pow(2,(m-69)/12);

/* ---------- audio engine ---------- */
let ac=null,master=null,revIn=null,noiseBuf=null,shaper=null;
function initAudio(){
  if(ac){ if(ac.state!=='running'){ try{ac.resume();}catch(e){} } return ac; }
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{ ac=new AC(); }catch(e){ ac=null; return null; }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-14; comp.knee.value=12; comp.ratio.value=5; comp.attack.value=.004; comp.release.value=.18;
  master=ac.createGain(); master.gain.value=.9;
  master.connect(comp); comp.connect(ac.destination);

  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
  const nd=noiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;

  const len=Math.floor(ac.sampleRate*1.6);
  const ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.8); }
  const conv=ac.createConvolver(); conv.buffer=ir;
  revIn=ac.createGain(); const rOut=ac.createGain(); rOut.gain.value=.55;
  revIn.connect(conv); conv.connect(rOut); rOut.connect(master);

  shaper=ac.createWaveShaper();
  const curve=new Float32Array(1024), k=2.5;
  for(let i=0;i<1024;i++){ const x=i*2/1023-1; curve[i]=Math.tanh(k*x)/Math.tanh(k); }
  shaper.curve=curve;
  const sg=ac.createGain(); sg.gain.value=.85;
  shaper.connect(sg); sg.connect(master);

  try{ const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0); }catch(e){}
  return ac;
}
function out(node,send){
  node.connect(master);
  if(send){ const s=ac.createGain(); s.gain.value=send; node.connect(s); s.connect(revIn); }
}
function outSat(node){ node.connect(shaper); }
function nz(t,dur){
  const s=ac.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  s.start(t,Math.random()*.5); s.stop(t+dur); return s;
}
function osc(type,f,t,dur){
  const o=ac.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t); o.start(t); o.stop(t+dur); return o;
}
function gainEnv(t,peak,dec,atk){
  const a=atk||.002, g=ac.createGain();
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(Math.max(.0002,peak),t+a);
  g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);
  return g;
}

/* drums */
function kick(t,v,o){
  const f=osc('sine',o.f0,t,o.dec+.08);
  f.frequency.exponentialRampToValueAtTime(o.f1,t+o.pd);
  const g=gainEnv(t,o.vol*v,o.dec,.002);
  f.connect(g); (o.sat?outSat:out)(g);
  if(o.click){
    const n=nz(t,.04), hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=o.click;
    const cg=gainEnv(t,.22*v,.02,.001); n.connect(hp); hp.connect(cg); out(cg);
  }
}
function snare(t,v,o){
  const n=nz(t,o.nd+.06), f=ac.createBiquadFilter();
  f.type='highpass'; f.frequency.value=o.nf;
  const ng=gainEnv(t,o.nv*v,o.nd,o.na||.001); n.connect(f); f.connect(ng); out(ng,o.rev);
  if(o.tone){
    const b=osc('triangle',o.tone,t,.25); b.frequency.exponentialRampToValueAtTime(o.tone*.6,t+.08);
    const tg=gainEnv(t,o.tv*v,o.td||.09,.001); b.connect(tg); out(tg,o.rev);
  }
}
function clap(t,v,o){
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=o.f||1500; bp.Q.value=o.q||1;
  const sum=ac.createGain(); sum.gain.value=o.vol; bp.connect(sum); out(sum,o.rev);
  if(!o.single){ [0,.012,.024].forEach(d=>{ const n=nz(t+d,.06), g=gainEnv(t+d,.8*v,.02,.001); n.connect(g); g.connect(bp); }); }
  const off=o.single?0:.036, n=nz(t+off,o.dec+.06), g=gainEnv(t+off,v,o.dec,.001); n.connect(g); g.connect(bp);
}
function hat(t,v,o){
  const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=o.hp||7000;
  const g=gainEnv(t,o.vol*v,o.dec,.001);
  if(o.metal){
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=10000; bp.Q.value=.6;
    [263,400,421,474,587,845].forEach(f=>{ const s=osc('square',f*1.6,t,o.dec+.06); s.connect(bp); });
    bp.connect(hp);
  }else{
    const n=nz(t,o.dec+.06); n.connect(hp);
  }
  hp.connect(g); out(g);
}
function rim(t,v){
  const o=osc('triangle',1750,t,.07), g=gainEnv(t,.4*v,.035,.001); o.connect(g); out(g);
  const n=nz(t,.05), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=3200; bp.Q.value=1;
  const ng=gainEnv(t,.3*v,.025,.001); n.connect(bp); bp.connect(ng); out(ng);
}
function cowbell(t,v){
  const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=900; bp.Q.value=.8;
  const g=gainEnv(t,.3*v,.2,.001);
  [540,800].forEach(f=>{ const o=osc('square',f,t,.26); o.connect(bp); });
  bp.connect(g); out(g);
}
function conga(t,v,f){
  const o=osc('sine',f*1.15,t,.32); o.frequency.exponentialRampToValueAtTime(f,t+.05);
  const g=gainEnv(t,.8*v,.22,.002); o.connect(g); out(g,.08);
}
function shaker(t,v){
  const n=nz(t,.12), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=6500; bp.Q.value=.9;
  const g=gainEnv(t,.35*v,.07,.012); n.connect(bp); bp.connect(g); out(g);
}
function swish(t,v){
  const n=nz(t,.5), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
  bp.frequency.setValueAtTime(3500,t); bp.frequency.exponentialRampToValueAtTime(6500,t+.35);
  const g=gainEnv(t,.28*v,.34,.05); n.connect(bp); bp.connect(g); out(g,.1);
}

/* effects */
function scratch(t,v){
  const n=nz(t,.4), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=7;
  bp.frequency.setValueAtTime(500,t);
  bp.frequency.exponentialRampToValueAtTime(3200,t+.09);
  bp.frequency.exponentialRampToValueAtTime(700,t+.19);
  bp.frequency.exponentialRampToValueAtTime(2600,t+.28);
  const g=ac.createGain();
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.9*v,t+.01);
  g.gain.setValueAtTime(.9*v,t+.22); g.gain.exponentialRampToValueAtTime(.0001,t+.34);
  n.connect(bp); bp.connect(g); out(g);
  const s=osc('sawtooth',200,t,.36);
  s.frequency.exponentialRampToValueAtTime(900,t+.09);
  s.frequency.exponentialRampToValueAtTime(260,t+.19);
  s.frequency.exponentialRampToValueAtTime(700,t+.28);
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
  const sg=ac.createGain(); sg.gain.setValueAtTime(.0001,t); sg.gain.linearRampToValueAtTime(.12*v,t+.01); sg.gain.exponentialRampToValueAtTime(.0001,t+.33);
  s.connect(lp); lp.connect(sg); out(sg);
}
function horn(t,v){
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200;
  const g=ac.createGain();
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.22*v,t+.015);
  g.gain.setValueAtTime(.22*v,t+.38); g.gain.exponentialRampToValueAtTime(.0001,t+.5);
  [523,659,784].forEach((f,i)=>{ const o=osc('sawtooth',f*.94,t,.52); o.frequency.exponentialRampToValueAtTime(f,t+.06); o.detune.value=(i-1)*8; o.connect(lp); });
  lp.connect(g); out(g,.15);
}
function whoosh(t,v){
  const n=nz(t,1), bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=3;
  bp.frequency.setValueAtTime(300,t); bp.frequency.exponentialRampToValueAtTime(5500,t+.8);
  const g=ac.createGain();
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.5*v,t+.75); g.gain.exponentialRampToValueAtTime(.0001,t+.9);
  n.connect(bp); bp.connect(g); out(g,.2);
}
function vibes(t,v){
  const m=[72,76,79,83][Math.floor(Math.random()*4)], f=mtof(m);
  const g=gainEnv(t,.4*v,1.6,.003), a=osc('sine',f,t,1.7); a.connect(g);
  const g2=gainEnv(t,.15*v,.5,.002), b=osc('sine',f*4,t,.6); b.connect(g2);
  out(g,.4); out(g2,.4);
}

/* bass and keys */
function bass(t,v,f,o){
  const dur=o.dec+.12;
  const g=gainEnv(t,o.vol*v,o.dec,o.atk||.004);
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=o.q||1;
  lp.frequency.setValueAtTime(o.lp0,t); lp.frequency.exponentialRampToValueAtTime(o.lp1,t+(o.lpt||.15));
  const a=osc(o.type,f,t,dur);
  if(o.glide){ a.frequency.setValueAtTime(f*o.glide,t); a.frequency.exponentialRampToValueAtTime(f,t+.04); }
  a.connect(lp);
  if(o.sub){ const s=osc('sine',f,t,dur), sg=ac.createGain(); sg.gain.value=o.sub; s.connect(sg); sg.connect(lp); }
  lp.connect(g); (o.sat?outSat:out)(g);
}
function epiano(t,v,ms,o){
  const sc=1/Math.pow(ms.length,.6);
  ms.forEach((m,i)=>{
    const tt=t+i*(o.strum||.008), f=mtof(m);
    const g=gainEnv(tt,o.vol*v*sc,o.dec,.004), a=osc('sine',f,tt,o.dec+.1); a.connect(g);
    const gb=gainEnv(tt,.35*o.vol*v*sc,o.dec*.35,.002), b=osc('sine',f*2,tt,o.dec); b.connect(gb);
    const gc=gainEnv(tt,.12*o.vol*v*sc,.08,.001), c=osc('triangle',f*4,tt,.2); c.connect(gc);
    out(g,o.rev); out(gb,o.rev); out(gc,o.rev);
  });
}
function organ(t,v,ms,o){
  const sc=1/Math.pow(ms.length,.6);
  ms.forEach(m=>{
    const f=mtof(m), g=gainEnv(t,o.vol*v*sc,o.dec,.012);
    [[1,1],[2,.5],[3,.28]].forEach(p=>{ const x=osc('sine',f*p[0],t,o.dec+.1), pg=ac.createGain(); pg.gain.value=p[1]; x.connect(pg); pg.connect(g); });
    out(g,o.rev);
  });
}
function stab(t,v,ms,o){
  const g=gainEnv(t,o.vol*v/Math.sqrt(ms.length),o.dec,.004);
  const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=2;
  lp.frequency.setValueAtTime(o.lp0,t); lp.frequency.exponentialRampToValueAtTime(o.lp1,t+o.dec*.8);
  ms.forEach(m=>{ [-7,7].forEach(c=>{ const a=osc('sawtooth',mtof(m),t,o.dec+.1); a.detune.value=c; a.connect(lp); }); });
  lp.connect(g); out(g,o.rev);
}
function padv(t,v,ms,o){
  const sc=1/Math.pow(ms.length,.6);
  ms.forEach(m=>{
    const f=mtof(m), g=ac.createGain();
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(o.vol*v*sc,t+o.atk); g.gain.exponentialRampToValueAtTime(.0001,t+o.dec);
    const a=osc('triangle',f,t,o.dec+.1), b=osc('sine',f*2,t,o.dec+.1); b.detune.value=5;
    const bg=ac.createGain(); bg.gain.value=.4; a.connect(g); b.connect(bg); bg.connect(g); out(g,o.rev);
  });
}
const KEYFN={ep:epiano,organ:organ,stab:stab,pad:padv};

/* voice factories */
const K=o=>(t,v)=>kick(t,v,o);

const range=(a,b,s)=>{ const r=[]; for(let i=a;i<=b;i+=s) r.push(i); return r; };

/* ---------- vibes ---------- */

    keys:{fn:'stab',names:['Em9','A9','Bm7','Dmaj7'],chords:[[52,55,59,62,66],[57,61,64,67,71],[59,62,66,69],[50,54,57,61]],o:{vol:.45,dec:.2,lp0:4200,lp1:700,rev:.12}},

    keys:{fn:'pad',names:['Cm9','Abmaj7','Fm7','Gm7'],chords:[[60,63,67,70,74],[56,60,63,67],[53,56,60,63],[55,58,62,65]],o:{vol:.5,atk:.04,dec:1.6,rev:.5}},
    pat:{kick:[0,7,16,23,26],snare:[8,24],clap:[8,24],hat:[0,2,4,6,8,10,12,13,14,15,16,18,20,22,24,26,28,29,30,31]}},

       hat:H({dec:.035,hp:8500,vol:.35}),clap:C({f:1500,dec:.2,vol:.7,rev:.25}),ohat:H({dec:.12,hp:7500,vol:.4}),cow:cowbell,horn:horn,whoosh:whoosh},
    a:[['BOOM','kick','kick'],['SNAP','snare','snare'],['TICK','hat','hat'],['CLAP','clap','clap']],

       ride:H({metal:1,dec:.55,hp:5200,vol:.11}),crash:H({dec:1.3,hp:3200,vol:.3}),swish:swish,vibes:vibes},

    pat:{ride:[0,4,6,8,12,14,16,20,22,24,28,30],hat:[4,12,20,28],kick:[[0,.5],[8,.35],[16,.5],[24,.35]],snare:[[6,.4],[14,.3],[22,.4],[30,.3]]}}

const DJS={ary:{vibes:['hiphop','soul','funk']},cali:{vibes:['rnb','house','jazz']}};

function defaultVel(lane,s){
  if(lane==='hat') return s%4===0?.9:(s%2===0?.65:.4);
  if(lane==='ride') return s%4===0?.9:.7;
  if(lane==='shaker') return .45;
  return 1;
}
Object.keys(VIBES).forEach(id=>{
  const d=VIBES[id], pads=[];
  d.a.forEach(r=>pads.push({n:r[0],s:r[1],k:1,fn:d.V[r[2]]}));
  d.b.forEach(r=>pads.push({n:r[0],s:r[1],k:2,fn:d.V[r[2]]}));
  d.bass.notes.forEach((m,i)=>pads.push({n:d.bass.names[i],s:'bass',k:3,fn:(t,v)=>bass(t,v,mtof(m),d.bass.o)}));
  d.keys.chords.forEach((c,i)=>pads.push({n:d.keys.names[i],s:'keys',k:4,fn:(t,v)=>KEYFN[d.keys.fn](t,v,c,d.keys.o)}));
  const by=[]; for(let i=0;i<32;i++) by.push([]);
  Object.keys(d.pat).forEach(lane=>d.pat[lane].forEach(e=>{
    const s=Array.isArray(e)?e[0]:e, vel=Array.isArray(e)?e[1]:defaultVel(lane,s);
    by[s].push({lane:lane,vel:vel});
  }));
  d.pads=pads; d.by=by;
});

/* ---------- state ---------- */
let dj='ary', vibeId='hiphop', vibe=VIBES.hiphop, bpm=vibe.bpm, tidy=true, backing=true;
let playing=false, recording=false, step=0, nextT=0, timer=null;
let stepLog=[], vis=[], layers=[], curLayer=null;
const padEls=[], padTimers=[];
const sd=()=>60/bpm/4;

/* ---------- scheduler ---------- */
function swOff(i){
  const s=vibe.swing;
  if(s.t==='16') return (i%2===1)?s.a*sd():0;
  if(s.t==='8') return (i%4===2)?s.a*2*sd():0;
  return 0;
}
function playPad(idx,t,vel){ const p=vibe.pads[idx]; if(p&&p.fn&&ac) p.fn(t,vel); }
function scheduleStep(i,t0){
  const at=t0+swOff(i);
  stepLog.push({i:i,t:at}); if(stepLog.length>12) stepLog.shift();
  vis.push({t:at,step:i});
  if(backing){
    vibe.by[i].forEach(e=>{ const fn=vibe.V[e.lane]; if(fn) fn(at,e.vel*.75); });
  }
  layers.forEach(layer=>layer.forEach(ev=>{
    if(Math.floor(ev.pos)!==i) return;
    const te=at+(ev.pos-i)*sd();
    if(ev.born!==undefined && te-ev.born<.25) return;
    playPad(ev.pad,te,1); vis.push({t:te,pad:ev.pad});
  }));
}
function tick(){
  if(!ac||!playing) return;
  while(nextT<ac.currentTime+.12){ scheduleStep(step,nextT); nextT+=sd(); step=(step+1)%32; }
}
function startT(){
  if(!initAudio()) return;
  playing=true; step=0; nextT=ac.currentTime+.08; stepLog=[];
  clearInterval(timer); timer=setInterval(tick,25); tick(); refresh();
}
function stopT(){
  playing=false; clearInterval(timer); timer=null;
  if(recording) stopRec();
  vis=vis.filter(e=>e.pad!==undefined);
  setDot(-1); refresh();
}
function curPos(now){
  let e=null;
  for(let k=stepLog.length-1;k>=0;k--){ if(stepLog[k].t<=now){ e=stepLog[k]; break; } }
  if(!e) return 0;
  return e.i+clamp((now-e.t)/sd(),0,.999);
}

/* ---------- recording ---------- */
function startRec(){
  if(!playing) startT();
  if(!playing) return;
  recording=true; curLayer=[]; layers.push(curLayer); refresh();
}
function stopRec(){
  recording=false;
  if(curLayer&&curLayer.length===0){ const k=layers.indexOf(curLayer); if(k>=0) layers.splice(k,1); }
  curLayer=null; refresh();
}
function undo(){
  if(recording&&curLayer&&curLayer.length===0){ if(layers.length>1) layers.splice(layers.length-2,1); }
  else{ const p=layers.pop(); if(recording&&p===curLayer){ curLayer=[]; layers.push(curLayer); } }
  refresh();
}
function clearLoop(){
  layers=[]; curLayer=null;
  if(recording){ curLayer=[]; layers.push(curLayer); }
  refresh();
}

/* ---------- playing the pads ---------- */
function hit(idx){
  if(!initAudio()) return;
  const now=ac.currentTime+.005;
  playPad(idx,now,1); lightPad(idx);
  if(recording&&playing&&curLayer){
    let pos=curPos(now);
    if(tidy) pos=Math.round(pos)%32;
    curLayer.push({pos:pos,pad:idx,born:ac.currentTime});
    refresh();
  }
}
function lightPad(i){
  const el=padEls[i]; if(!el) return;
  el.classList.add('hit'); clearTimeout(padTimers[i]);
  padTimers[i]=setTimeout(()=>el.classList.remove('hit'),110);
}

/* ---------- interface ---------- */
const vibesEl=$('vibes'), hintEl=$('hint'), dotsEl=$('dots'), padsEl=$('pads');
const dotEls=Array.from(dotsEl.children);
const btnPlay=$('btnPlay'), btnRec=$('btnRec');

for(let i=0;i<16;i++){
  const b=document.createElement('button'); b.type='button'; b.className='pad';
  const n=document.createElement('span'); n.className='n';
  const s=document.createElement('span'); s.className='s';
  b.append(n,s); padsEl.append(b); padEls.push(b);
  b.addEventListener('pointerdown',e=>{ e.preventDefault(); hit(i); });
  b.addEventListener('click',e=>{ if(e.detail===0) hit(i); });
  b.addEventListener('contextmenu',e=>e.preventDefault());
}
function paintPads(){
  vibe.pads.forEach((p,i)=>{
    const el=padEls[i];
    el.className='pad k'+p.k;
    el.children[0].textContent=p.n; el.children[1].textContent=p.s;
    el.setAttribute('aria-label',p.n+' '+p.s);
  });
}
function renderVibes(){
  vibesEl.replaceChildren();
  DJS[dj].vibes.forEach(id=>{
    const b=document.createElement('button'); b.type='button'; b.className='vibe';
    b.textContent=VIBES[id].name; b.setAttribute('aria-pressed',String(id===vibeId));
    b.addEventListener('click',()=>setVibe(id));
    vibesEl.append(b);
  });
}
function setDot(step){
  const d=step<0?-1:Math.floor(step/4);
  dotEls.forEach((el,k)=>el.classList.toggle('on',k===d));
}
function refresh(){
  $('icPlay').toggleAttribute('hidden',playing); $('icStop').toggleAttribute('hidden',!playing);
  $('playTxt').textContent=playing?'Stop':'Play';
  btnPlay.setAttribute('aria-label',playing?'Stop the beat':'Play the beat');
  btnRec.setAttribute('aria-pressed',String(recording));
  dotsEl.classList.toggle('rec',recording);
  $('bpmOut').innerHTML='<b>'+bpm+'</b> BPM';
  document.querySelectorAll('.dj').forEach(b=>{
    b.setAttribute('aria-pressed',String(b.dataset.dj===dj));
    b.classList.toggle('spin',playing&&b.dataset.dj===dj);
  });
  const filled=layers.filter(l=>l.length>0).length;
  hintEl.textContent=!playing?'Tap PLAY to start the beat, then jam on the pads.'
    :recording?'Recording! Play the pads. Tap REC again to stop.'
    :filled?'Your loop is playing. Tap REC to add another layer.'
    :'Tap REC to record your own loop.';
}
function setVibe(id){
  vibeId=id; vibe=VIBES[id]; bpm=vibe.bpm;
  layers=[]; curLayer=null; recording=false;
  paintPads(); renderVibes(); refresh();
}
function setDj(id){
  dj=id; document.documentElement.dataset.dj=id;
  setVibe(DJS[id].vibes[0]);
}

document.querySelectorAll('.dj').forEach(b=>b.addEventListener('click',()=>{ initAudio(); setDj(b.dataset.dj); }));
btnPlay.addEventListener('click',()=>{ initAudio(); if(playing) stopT(); else startT(); });
btnRec.addEventListener('click',()=>{ initAudio(); if(recording) stopRec(); else startRec(); });
$('btnUndo').addEventListener('click',undo);
$('btnClear').addEventListener('click',clearLoop);
$('bpmDown').addEventListener('click',()=>{ bpm=clamp(bpm-4,Math.round(vibe.bpm*.7),Math.round(vibe.bpm*1.3)); refresh(); });
$('bpmUp').addEventListener('click',()=>{ bpm=clamp(bpm+4,Math.round(vibe.bpm*.7),Math.round(vibe.bpm*1.3)); refresh(); });
$('btnTidy').addEventListener('click',e=>{ tidy=!tidy; e.currentTarget.setAttribute('aria-pressed',String(tidy)); });
$('btnBack').addEventListener('click',e=>{ backing=!backing; e.currentTarget.setAttribute('aria-pressed',String(backing)); });

const KEYS='1234qwerasdfzxcv';
document.addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.code==='Space'){ e.preventDefault(); initAudio(); if(playing) stopT(); else startT(); return; }
  const idx=KEYS.indexOf((e.key||'').toLowerCase());
  if(idx>=0&&e.key.length===1){ hit(idx); }
});
['pointerdown','touchend','click','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ initAudio(); },{passive:true}));
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&playing) stopT(); });

function frame(){
  if(ac&&vis.length){
    const now=ac.currentTime, keep=[];
    for(const e of vis){
      if(e.t<=now){ if(e.pad!==undefined) lightPad(e.pad); if(e.step!==undefined) setDot(e.step); }
      else keep.push(e);
    }
    vis=keep;
  }
  requestAnimationFrame(frame);
}
setDj('ary');
requestAnimationFrame(frame);
})();
